# Craft Hub on Netlify: no framework, the build only downloads the four web releases.
[build]
  command = "bash scripts/fetch-apps.sh"
  publish = "dist"

# ---- headers ---------------------------------------------------------------
# No SPA fallback on purpose: the apps need missing files to be real 404s.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
# Everything else keeps Netlify's default "public, max-age=0, must-revalidate": the apps reuse
# file names between releases, so browsers must revalidate them (cheap 304s).

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

# PhotoCraft's app parts and boot module carry a content hash in their names.
[[headers]]
  for = "/photocraft/app/*.part-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/photocraft/photocraft-web-boot-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
